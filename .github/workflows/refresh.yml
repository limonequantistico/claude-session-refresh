name: refresh

# Opens a Claude Code usage window by pinging the API with the subscription token.
#
# The schedule deliberately does NOT live here. An external cron (cron-job.org) POSTs a
# workflow_dispatch at 08:00 / 13:00 / 18:00 / 23:00 Europe/Rome; GitHub only executes.
# GitHub's own `schedule` queue is not used because it degraded to 2-4 hour delays with
# dropped firings — see docs/archive/2026-09-03-scheduler-migration.md.
#
# Consequences worth knowing before editing this file:
#   - To change the hours, edit the crontab on cron-job.org. Nothing here encodes them.
#   - DST needs no handling: the external cron resolves Europe/Rome itself.
#   - Dispatch arrives within seconds of the hour, so there is no buffer and no sleep.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Rome

    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: |
          set -euo pipefail
          npm i -g @anthropic-ai/claude-code
          claude --version

      - name: Ping
        id: ping
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          # Recorded before the call, so a failed ping still reports when it was attempted.
          echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "Pinging at $(date '+%F %H:%M:%S %Z')."
          claude -p --model haiku --safe-mode --no-session-persistence "Reply with just: ok"

      - name: Log + commit
        if: always()
        env:
          PING_OUTCOME: ${{ steps.ping.outcome }}
          PING_AT: ${{ steps.ping.outputs.at }}
        run: |
          set -euo pipefail

          # The window is anchored by the ping, so everything is derived from when the ping
          # actually happened — never from a target this file assumes. Targets are NOT on the
          # hour (they are staggered 5h01m apart), so rounding to the hour here would be wrong.
          ping_at="${PING_AT:-$(date +%s)}"
          target=$(( ping_at - ping_at % 60 ))   # floor to the minute

          # The cron fires on a whole minute, so the seconds in the ping timestamp ARE the
          # trigger delay. Health metric: it should read well under :60. A label that matches
          # no scheduled minute means the delay exceeded a minute and pushed it into the next.
          target_label=$(date -d "@$target" '+%F %H:%M')
          ping_label=$(date -d "@$ping_at" '+%H:%M:%S')
          expiry=$(date -d "@$(( target + 5 * 3600 ))" '+%H:%M')
          month=$(date -d "@$target" '+%Y-%m')

          if [ "$PING_OUTCOME" = "success" ]; then
            line="${target_label} — window opened (ping ${ping_label}) → expires ${expiry}"
          else
            line="${target_label} — PING FAILED (ping ${ping_label}) → no window opened"
          fi

          mkdir -p log
          file="log/${month}.md"
          [ -f "$file" ] || printf '# %s\n\n' "$month" > "$file"
          printf '%s\n' "$line" >> "$file"

          {
            echo "### $line"
            echo
            echo "- ping outcome: \`$PING_OUTCOME\`"
            echo "- ping at: \`$ping_label\`"
            echo "- log file: \`$file\`"
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "log: ${target_label}"

          # Commits made with GITHUB_TOKEN do not re-trigger workflows: no loop.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push failed (attempt $attempt), retrying after rebase."
            git pull --rebase --autostash
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
