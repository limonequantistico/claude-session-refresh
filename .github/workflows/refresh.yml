name: refresh

# Apre una finestra di utilizzo Claude Code alle 08:00 / 13:00 / 18:00 / 23:00 (Europe/Rome).
#
# Il cron di GitHub Actions non e' puntuale (ritardi di 15+ minuti sono normali), quindi il
# job parte 30 minuti PRIMA del target e dorme fino allo scoccare dell'ora esatta: il ritardo
# viene assorbito dal buffer invece di propagarsi sull'orario della finestra.
#
# Il cron di Actions e' solo UTC e non conosce l'ora legale, quindi servono due serie di voci.
# Quella della stagione sbagliata viene scartata dal guard "stagione" nello step 1.

on:
  schedule:
    - cron: '30 6,11,16,21 * * *'   # inverno CET  (UTC+1) -> 7:30/12:30/17:30/22:30 locali
    - cron: '30 5,10,15,20 * * *'   # estate  CEST (UTC+2) -> 7:30/12:30/17:30/22:30 locali
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Rome
      TARGET_HOURS: '8 13 18 23'
      # Buffer: quanto il cron puo' essere in ritardo (EARLY_S) o in anticipo (LATE_S)
      # rispetto al target e continuare comunque ad ancorare quella finestra.
      EARLY_S: '2700'   # 45 min nel futuro  -> il job dorme fino al target
      LATE_S: '3600'    # 60 min nel passato -> il job procede subito e logga il ritardo

    steps:
      - uses: actions/checkout@v4

      - name: Calcola il target
        id: target
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          # --- Guard stagione -------------------------------------------------
          # Meta' delle voci di cron, a seconda della stagione, non deve fare niente.
          # github.event.schedule dice quale voce ha triggerato il run; la confrontiamo
          # con l'offset UTC attuale di Europe/Rome.
          offset=$(date +%z)
          case "$offset" in
            +0100) attesa='30 6,11,16,21 * * *' ;;
            +0200) attesa='30 5,10,15,20 * * *' ;;
            *)     attesa='' ;;
          esac
          if [ -n "${EVENT_SCHEDULE:-}" ] && [ -n "$attesa" ] && [ "$EVENT_SCHEDULE" != "$attesa" ]; then
            echo "Cron della stagione sbagliata ('$EVENT_SCHEDULE', offset locale $offset): esco."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- Ricerca del target ---------------------------------------------
          # Primo orario fra quelli previsti che cada fra -LATE_S e +EARLY_S da adesso.
          # I target distano almeno 5 ore, quindi al massimo uno puo' rientrare.
          now=$(date +%s)
          target=""; delta=""
          for h in $TARGET_HOURS; do
            t=$(date -d "today ${h}:00:00" +%s)
            d=$(( t - now ))
            if [ "$d" -ge "-$LATE_S" ] && [ "$d" -le "$EARLY_S" ]; then
              target=$t; delta=$d; break
            fi
          done

          if [ -z "$target" ]; then
            echo "Nessun target vicino (ora locale $(date '+%F %T %Z')): esco."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Il cron nominale e' 30 minuti prima del target: tutto cio' che manca a
          # quei 30 minuti e' ritardo accumulato da GitHub.
          ritardo_s=$(( 1800 - delta ))
          if [ "$ritardo_s" -lt 0 ]; then ritardo_s=0; fi

          {
            echo "proceed=true"
            echo "target=$target"
            echo "delta=$delta"
            echo "ritardo_min=$(( ritardo_s / 60 ))"
            echo "target_label=$(date -d "@$target" '+%F %H:%M')"
            echo "scadenza_label=$(date -d "@$(( target + 5 * 3600 ))" '+%H:%M')"
            echo "mese=$(date -d "@$target" '+%Y-%m')"
          } >> "$GITHUB_OUTPUT"

          echo "Target: $(date -d "@$target" '+%F %H:%M:%S %Z') (fra ${delta}s, ritardo cron $(( ritardo_s / 60 )) min)"

      # Node e la CLI vengono installati PRIMA della dormita: al risveglio il ping
      # parte subito, senza i ~20s di npm install a spostare l'orario della finestra.
      - name: Installa Claude Code
        if: steps.target.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          npm i -g @anthropic-ai/claude-code
          claude --version

      - name: Attendi lo scoccare dell'ora
        if: steps.target.outputs.proceed == 'true'
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          restano=$(( TARGET - $(date +%s) ))
          if [ "$restano" -gt 0 ]; then
            echo "Dormo ${restano}s fino a $(date -d "@$TARGET" '+%H:%M:%S %Z')."
            sleep "$restano"
          else
            echo "Target gia' passato di $(( -restano ))s: procedo subito."
          fi

      - name: Ping
        id: ping
        if: steps.target.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          echo "Ping alle $(date '+%F %H:%M:%S %Z')."
          claude -p --model haiku --safe-mode --no-session-persistence "Rispondi solo: ok"

      - name: Log + commit
        if: always() && steps.target.outputs.proceed == 'true'
        env:
          MESE: ${{ steps.target.outputs.mese }}
          TARGET_LABEL: ${{ steps.target.outputs.target_label }}
          SCADENZA: ${{ steps.target.outputs.scadenza_label }}
          RITARDO_MIN: ${{ steps.target.outputs.ritardo_min }}
          ESITO_PING: ${{ steps.ping.outcome }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$TRIGGER" = "schedule" ]; then
            nota="cron in ritardo di ${RITARDO_MIN} min"
          else
            nota="avvio manuale"
          fi

          if [ "$ESITO_PING" = "success" ]; then
            riga="${TARGET_LABEL} — finestra aperta (${nota}) → scade ${SCADENZA}"
          else
            riga="${TARGET_LABEL} — PING FALLITO (${nota}) → nessuna finestra aperta"
          fi

          mkdir -p log
          file="log/${MESE}.md"
          [ -f "$file" ] || printf '# %s\n\n' "$MESE" > "$file"
          printf '%s\n' "$riga" >> "$file"

          {
            echo "### $riga"
            echo
            echo "- trigger: \`$TRIGGER\`"
            echo "- esito ping: \`${ESITO_PING:-skipped}\`"
            echo "- log: \`$file\`"
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          if git diff --staged --quiet; then
            echo "Niente da committare."
            exit 0
          fi
          git commit -m "log: ${TARGET_LABEL}"

          # I commit fatti col GITHUB_TOKEN non ri-triggerano workflow: nessun loop.
          for tentativo in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push fallito (tentativo $tentativo), riprovo dopo rebase."
            git pull --rebase --autostash
          done
          echo "Push fallito dopo 3 tentativi." >&2
          exit 1

      - name: Summary (nessun target)
        if: steps.target.outputs.proceed != 'true'
        run: echo "Nessuna finestra da aprire in questo run (guard stagione o nessun target vicino)." >> "$GITHUB_STEP_SUMMARY"
